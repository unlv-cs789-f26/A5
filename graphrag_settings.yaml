### CS 789 A5 -- Microsoft GraphRAG settings, wired to the two local vLLM servers.
### chat model  : "llm" on http://localhost:8000/v1   (started by H.start_vllm)
### embeddings  : "emb" on http://localhost:8001/v1   (started by H.start_embedder)
### Full reference: https://microsoft.github.io/graphrag/config/yaml/

completion_models:
  default_completion_model:
    model_provider: openai
    model: llm
    api_base: http://localhost:8000/v1
    auth_method: api_key
    api_key: EMPTY
    retry:
      type: exponential_backoff

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: emb
    api_base: http://localhost:8001/v1
    auth_method: api_key
    api_key: EMPTY
    call_args:
      extra_body:
        truncate_prompt_tokens: 510   # bge-base reads 512 word-pieces; DRIFT embeds long texts
    retry:
      type: exponential_backoff

concurrent_requests: 48   # vLLM batches these; the L4 is only ~20% busy at 16

input:
  type: text
  file_pattern: ".*\\.md$$"   # "$$" is a literal dollar sign here

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: o200k_base

input_storage:
  type: file
  base_dir: "input"

output_storage:
  type: file
  base_dir: "output"

reporting:
  type: file
  base_dir: "logs"

cache:
  type: json
  storage:
    type: file
    base_dir: "cache"

vector_store:
  type: lancedb
  db_uri: output/lancedb

embed_text:
  embedding_model_id: default_embedding_model
  batch_max_tokens: 300   # bge-base reads at most 512 word-pieces: longer texts are embedded in pieces and averaged

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  entity_types: {ENTITY_TYPES}
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: true
  embeddings: false

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"
  drift_k_followups: 3   # defaults are 20 follow-ups x 3 rounds: several minutes per question on a small GPU
  n_depth: 1

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
